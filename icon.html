  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    margin: 0;
    padding: 0;
    background: #fff8fa;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "MiSans", "Manrope", sans-serif;
  }

  .icon {
    position: relative;
    width: 1200px;
    height: 1200px;
    flex: 0 0 auto;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(760px 680px at 8% 6%, rgba(255, 176, 200, .62), transparent 66%),
      radial-gradient(720px 700px at 96% 88%, rgba(255, 206, 182, .58), transparent 66%),
      radial-gradient(620px 620px at 92% 8%, rgba(232, 210, 255, .40), transparent 70%),
      radial-gradient(640px 560px at 4% 92%, rgba(255, 239, 195, .44), transparent 70%),
      linear-gradient(138deg, #fff9fb 0%, #fff0f5 34%, #ffe4ee 66%, #ffd7e4 100%);
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(64px);
    z-index: 1;
  }
  .glow-a {
    width: 520px; height: 520px;
    left: -140px; top: 420px;
    background: rgba(255, 195, 214, .55);
  }
  .glow-b {
    width: 520px; height: 520px;
    right: 40px; bottom: 10px;
    background: rgba(255, 220, 185, .50);
  }
  .glow-c {
    width: 380px; height: 380px;
    right: -80px; top: 180px;
    background: rgba(235, 213, 255, .42);
  }

  .halo {
    position: absolute;
    z-index: 2;
    width: 1100px;
    height: 1100px;
    left: 50px;
    top: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, .72) 0%, rgba(255, 255, 255, .38) 46%, rgba(255, 255, 255, 0) 74%);
    filter: blur(6px);
  }

  .petal {
    position: absolute;
    z-index: 2;
    background: linear-gradient(135deg, #fff7fa 0%, #ffc4d5 100%);
    border-radius: 72% 28% 64% 36% / 58% 42% 58% 42%;
    box-shadow: 0 8px 18px rgba(220, 110, 145, .13);
    opacity: .72;
    pointer-events: none;
  }
  .petal-a { width: 54px; height: 34px; left: 78px; top: 246px; transform: rotate(24deg); }
  .petal-b { width: 40px; height: 26px; left: 160px; top: 214px; transform: rotate(-38deg); opacity: .55; }
  .petal-c { width: 58px; height: 38px; right: 106px; top: 284px; transform: rotate(-22deg); opacity: .48; }
  .petal-d { width: 46px; height: 30px; right: 180px; bottom: 246px; transform: rotate(32deg); opacity: .58; }
  .petal-e { width: 34px; height: 22px; left: 230px; bottom: 190px; transform: rotate(-18deg); opacity: .45; }
  .petal-f { width: 44px; height: 28px; right: 300px; top: 132px; transform: rotate(58deg); opacity: .40; }

  .blossom {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 14px 24px rgba(220, 110, 145, .10));
  }
  .blossom-a { width: 150px; height: 150px; left: 46px; top: 82px; opacity: .42; }
  .blossom-b { width: 116px; height: 116px; right: 82px; bottom: 74px; opacity: .35; }
  .blossom-c { width: 66px; height: 66px; right: 156px; top: 96px; opacity: .27; }

  .window {
    position: absolute;
    z-index: 4;
    left: 118px;
    top: 390px;
    width: 964px;
    height: 430px;
    border-radius: 42px;
    background: rgba(255, 255, 255, .45);
    border: 2px solid rgba(255, 255, 255, .80);
    box-shadow:
      0 52px 110px rgba(168, 72, 104, .28),
      0 18px 42px rgba(168, 72, 104, .14),
      inset 0 1px 0 rgba(255, 255, 255, .85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .window-bar {
    display: flex;
    align-items: center;
    height: 64px;
    padding: 0 30px;
    border-bottom: 1px solid rgba(205, 120, 148, .10);
    border-radius: 40px 40px 0 0;
  }

  .dots {
    display: flex;
    gap: 9px;
  }

  .dots i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }

  .dots i:nth-child(1) { background: #f08da3; }
  .dots i:nth-child(2) { background: #ffc89f; }
  .dots i:nth-child(3) { background: #d8c6ff; }

  .window-label {
    margin-left: 18px;
    color: #a75c73;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: .16em;
  }

  .window-date {
    margin-left: auto;
    color: #9d586f;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: .18em;
  }

  .window-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 64px 0;
  }

  .title {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    white-space: nowrap;
    transform: translateX(-4px);
  }

  .title .class {
    font-family: "RHR", "MiSans", sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: 166px;
    line-height: .86;
    letter-spacing: -.005em;
    color: #4b2434;
    filter: drop-shadow(0 14px 20px rgba(120, 40, 70, .26));
  }

  .title .nex {
    font-family: "Manrope", "Segoe UI", sans-serif;
    font-weight: 800;
    font-size: 166px;
    line-height: .82;
    letter-spacing: -.025em;
    background: linear-gradient(180deg, #a93b5c 0%, #cf4e71 48%, #ec7c98 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 14px 22px rgba(180, 60, 95, .28));
  }

  .schedule {
    width: 100%;
    margin-top: 42px;
  }

  .schedule-head {
    display: flex;
    align-items: center;
    color: #a55970;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: .18em;
  }

  .schedule-head .right {
    margin-left: auto;
    letter-spacing: .12em;
    opacity: .8;
  }

  .bars {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 13px;
    height: 24px;
  }

  .bar {
    height: 14px;
    border-radius: 999px;
    background: #ffe4ec;
    border: 1px solid rgba(220, 120, 150, .12);
  }

  .bar:nth-child(1) { width: 16%; background: #ffe0ea; }
  .bar:nth-child(2) { width: 12%; background: #fff0d6; }
  .bar:nth-child(3) { width: 21%; background: #ffd6e3; }
  .bar:nth-child(4) { width: 14%; background: #f1e2ff; }
  .bar:nth-child(5) { width: 17%; background: #ffe8ef; }

  .bar.active {
    width: 20%;
    height: 22px;
    background: linear-gradient(90deg, #d94f74, #f08aa3);
    border: 0;
    box-shadow: 0 8px 18px rgba(215, 80, 115, .22);
    position: relative;
  }

  .bar.active::after {
    content: "";
    position: absolute;
    left: 12px;
    top: 50%;
    width: 7px;
    height: 7px;
    margin-top: -3.5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .18);
  }
</style>
</head>
