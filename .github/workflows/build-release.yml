name: Build and Release

on:
  push:
    tags:
      - '26w*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: LingOfficial
  GIT_AUTHOR_EMAIL: 203777411+LingOfficial@users.noreply.github.com
  GIT_COMMITTER_NAME: LingOfficial
  GIT_COMMITTER_EMAIL: 203777411+LingOfficial@users.noreply.github.com

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '_.*$', ''
          dotnet publish src\ClassNex\ClassNex.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o build\release\app-$ver-0
          Remove-Item build\release\app-$ver-0\data -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build\release\app-$ver-0\Assets\timetable.yaml -Force -ErrorAction SilentlyContinue
          dotnet publish src\ClassNex.Launcher\ClassNex.Launcher.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -o build\launcher
          Copy-Item build\launcher\ClassNex.exe build\release\ClassNex.exe
          [System.IO.File]::WriteAllText("$PWD\build\release\PackageType", "folder", (New-Object System.Text.UTF8Encoding($false)))
          python tools\make_files_json.py build\release $ver 0

      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '_.*$', ''
          $out = "build\ClassNEX-$ver-Alpha-win-x64.zip"
          Compress-Archive -Path build\release\* -DestinationPath $out -CompressionLevel Optimal
          "ZIP_PATH=$out" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ env.ZIP_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/26w')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "LingOfficial"
          git config user.email "203777411+LingOfficial@users.noreply.github.com"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          VER="${GITHUB_REF_NAME%%_*}"
          ASSET="ClassNEX-${VER}-Alpha-win-x64.zip"
          cp RELEASE_NOTES.md /tmp/notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "ClassNEX $GITHUB_REF_NAME" --notes-file /tmp/notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" --title "ClassNEX $GITHUB_REF_NAME" --notes-file /tmp/notes.md --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
