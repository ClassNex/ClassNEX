server {
    listen 80;
    server_name classnex.tech www.classnex.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /www/server/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name classnex.tech www.classnex.tech;

    ssl_certificate /www/server/panel/vhost/cert/classnex.tech/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/classnex.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass https://206.187.201.60;
        proxy_http_version 1.1;
        proxy_set_header Host classnex.tech;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name classnex.tech;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }
}
